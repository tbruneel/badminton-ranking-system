<h1 id="technical-architecture--implementation-guide">Technical Architecture &amp; Implementation Guide</h1>
<p>This document explains what we implemented in the <strong>Badminton ELO Ranking System</strong>, how the frontend and backend work together, and the architectural decisions behind the system.</p>
<hr>
<h2 id="1-architecture-overview--why-github-pages--google-apps-script">1. Architecture Overview &amp; Why GitHub Pages + Google Apps Script</h2>
<p>Traditional sports ranking apps require a hosted database, a backend server, and ongoing maintenance or cloud costs. We designed a <strong>two-tier zero-cost serverless architecture</strong>:</p>
<ol>
<li><strong>Static Frontend on GitHub Pages (<a href="./template.html"><code>template.html</code></a> &amp; per-group <code>index.html</code>):</strong>
<ul>
<li><strong>Why GitHub Pages?</strong> Unlike Google Apps Script's built-in <code>HtmlService</code> (which wraps pages inside a sandboxed double-<code>&lt;iframe&gt;</code> with a Google warning banner, blocks custom favicons/titles, and breaks mobile viewport scaling), GitHub Pages serves the application directly over a clean HTTPS URL with full control over the DOM, <code>&lt;head&gt;</code> metadata, favicons, and responsive layout.</li>
<li><strong>Single Template, Multiple Groups:</strong> The core application lives in <a href="./template.html"><code>template.html</code></a> rather than a root <code>index.html</code>. Navigating to the root repository URL does not expose a generic unconfigured ranking page, and opening <code>template.html</code> directly without a <code>window.RANKING_CONFIG</code> object renders a blank <code>404 Not Found</code> state. Each badminton group gets its own subfolder (e.g., <a href="./vub-sportmix-badminton/index.html"><code>vub-sportmix-badminton/index.html</code></a>) that defines its custom favicons, page title, and Google Apps Script <code>apiUrl</code>, then fetches and injects <code>../template.html</code>.</li>
</ul>
</li>
<li><strong>Serverless JSON API &amp; Spreadsheet Engine (<a href="./code.gs"><code>code.gs</code></a>):</strong>
<ul>
<li><strong>Why Google Sheets + Apps Script?</strong> Club organizers can inspect, audit, or manually edit players and matches directly in a familiar spreadsheet, while Google Apps Script exposes the spreadsheet as a JSON REST endpoint (<code>doGet</code> and <code>doPost</code>) at zero cost.</li>
</ul>
</li>
</ol>
<hr>
<h2 id="2-google-sheets-database--formula-engine">2. Google Sheets Database &amp; Formula Engine</h2>
<p>The Google Sheet acts as both the data store and the reactive calculation engine. Running <code>setupSheet()</code> in <a href="./code.gs"><code>code.gs</code></a> provisions three tabs:</p>
<ul>
<li><strong><code>Players</code>:</strong> Stores each player's <code>Name</code> (Column A) and dynamically computes their Doubles and Singles <code>ELO</code>, <code>Peak ELO</code>, <code>Matches</code>, <code>Wins</code>, <code>Losses</code>, <code>Ties</code>, and <code>Win Rate</code> (Columns B–O).</li>
<li><strong><code>Doubles_Matches</code> (23 columns, A–W):</strong>
<ul>
<li><strong>Input Columns (A–H):</strong> <code>Match ID</code>, <code>Date</code>, <code>Team 1 Player 1</code>, <code>Team 1 Player 2</code>, <code>Team 2 Player 1</code>, <code>Team 2 Player 2</code>, <code>Set 1 (T1-T2)</code>, <code>Set 2 (T1-T2)</code>, <code>Set 3 (T1-T2)</code>.</li>
<li><strong>Calculated Columns (I–W):</strong> Automatically parse set scores (supporting both hyphen <code>21-15</code> and colon <code>21:15</code> formats), count sets won and total points scored per team, look up each player's prior ELO from the most recent earlier row above it via <code>INDEX</code>/<code>MATCH</code>, compute the match ELO delta, and output each player's updated post-match ELO.</li>
</ul>
</li>
<li><strong><code>Singles_Matches</code> (19 columns, A–S):</strong>
<ul>
<li>Follows the exact same structure as <code>Doubles_Matches</code>, tailored for 1v1 matches (<code>Player 1</code> vs. <code>Player 2</code>).</li>
</ul>
</li>
</ul>
<h3 id="chronological-row-order--elo-calculation">Chronological Row Order &amp; ELO Calculation</h3>
<p>Spreadsheet formulas calculate a player's pre-match ELO in row <code>r</code> by searching rows <code>2..r-1</code> for the last row where that player appeared (defaulting to <code>STARTING_ELO = 1000</code> if none is found). Because row order determines the chronological sequence of ELO ratings:</p>
<ul>
<li>Whenever a match is logged via the API or edited in the sheet, <code>sortMatchesByDate_(sheet, config)</code> in <a href="./code.gs"><code>code.gs</code></a> sorts all match rows chronologically by Column B (<code>Date</code>) in ascending order and re-sequences the <code>Match ID</code> column (<code>1..N</code>).</li>
</ul>
<h3 id="self-healing-formula-repair">Self-Healing Formula Repair</h3>
<p>If an organizer manually inserts, deletes, or reorders rows in Google Sheets, spreadsheet cell references could shift or break. To prevent this:</p>
<ul>
<li>An installable <code>onChange</code> trigger runs <code>onSheetChange(e)</code> whenever rows are edited, inserted, or removed.</li>
<li><code>repairAllFormulas_()</code> re-applies the canonical row formulas across all populated rows in <code>Players</code>, <code>Doubles_Matches</code>, and <code>Singles_Matches</code> and flushes the spreadsheet so ratings are always consistent.</li>
</ul>
<hr>
<h2 id="3-elo-rating-model--math">3. ELO Rating Model &amp; Math</h2>
<p>All ELO parameters are configured in a single place at the top of <a href="./code.gs"><code>code.gs</code></a> (<code>STARTING_ELO = 1000</code>, <code>BASE_K = 40</code>, <code>MARGIN_K = 20</code>) and passed down to the frontend in the API payload so the live match preview and the spreadsheet always use identical math:</p>
<ul>
<li><strong>Starting Rating:</strong> Every player starts at <strong><code>1000</code> Elo</strong> in both Singles and Doubles.</li>

<h2 id="4-security--concurrency-in-codegs">4. Security &amp; Concurrency in <code>code.gs</code></h2>
<ul>
<li><strong>Server-Side Admin Authentication:</strong> The admin password is never stored in the repository or frontend code. It is read exclusively from Google Apps Script's private <code>PropertiesService.getScriptProperties().getProperty('ADMIN_PASSWORD')</code> using a constant-time bitwise comparison (<code>verifyAdminPassword_</code>) to prevent timing side-channels.</li>
<li><strong>Formula Injection Protection:</strong> All user-supplied strings (such as player names) are sanitized via <code>sanitizeCellInput_</code> (stripping leading <code>=</code>, <code>+</code>, <code>-</code>, <code>@</code>, tab, or newline characters) before being written to the sheet.</li>
<li><strong>Concurrency Locking:</strong> Write actions (<code>logMatch</code>, <code>addPlayer</code>) acquire a script-wide mutex lock via <code>LockService.getScriptLock()</code> before modifying rows, sorting dates, and repairing formulas, preventing race conditions when two matches are logged simultaneously.</li>
</ul>
<hr>
<h2 id="5-frontend-ux--engineering-details-templatehtml">5. Frontend UX &amp; Engineering Details (<code>template.html</code>)</h2>
<ul>
<li><strong>Zero-Step Build Stack:</strong> Built with vanilla ES6 JavaScript, Tailwind CSS (via CDN), and Chart.js so it can be hosted directly on GitHub Pages without a bundler or build pipeline.</li>
<li><strong>Client-Side Caching &amp; Optimistic Feel:</strong> The last fetched API response is cached in <code>localStorage</code> scoped by the group's <code>apiUrl</code>, allowing instant rendering on page load while fresh data is fetched in the background.</li>
<li><strong>Match Creation Modal UX:</strong>
<ul>
<li><strong>Fixed Top Alignment:</strong> Uses <code>items-start</code> modal positioning so switching between <strong>Doubles (2v2)</strong> and <strong>Singles (1v1)</strong> never shifts the top of the card or the mode toggle buttons.</li>
<li><strong>Session-Only Form State:</strong> Opening the Log Match modal always starts with clean, empty fields, while switching between Doubles and Singles within an open session preserves any names or scores entered during that session.</li>
<li><strong>Searchable Player Comboboxes:</strong> Custom filterable dropdown inputs with full keyboard support (<code>Tab</code> cycles through matching players in the dropdown; <code>Enter</code> autocompletes the highlighted player) and automatic duplicate-player prevention across slots.</li>
<li><strong>SliceWin-Style Score Entry:</strong> Displays one row per side labeled dynamically with the selected players' first names, expanding from 2 sets to 3 sets on demand via a <code>+ Set</code> button, and hiding the <code>–</code> placeholder immediately when a score input is focused.</li>
</ul>
</li>
<li><strong>Modal Polish:</strong>
<ul>
<li><strong>Zero Layout Shift:</strong> Opening any overlay compensates for the browser scrollbar width via <code>document.body.style.paddingRight</code> so the background leaderboard never jumps horizontally.</li>
<li><strong>Drag-Safe Backdrops:</strong> Modal backdrops only close when both <code>mousedown</code> and <code>mouseup</code> occur on the backdrop itself, preventing accidental closes when clicking and dragging across text or inputs inside a card.</li>
</ul>
</li>
</ul>

  function createCheckIcon() {

  function initCopyButtons() {
    var blocks = document.querySelectorAll('pre > code');
    for (var i = 0; i < blocks.length; i++) {
      (function (code) {
        var pre = code.parentElement;
        if (!pre || pre.querySelector('.code-block-copy-button')) return;
        var btn = document.createElement('button');
        btn.className = 'code-block-copy-button';
        btn.type = 'button';
        btn.setAttribute('aria-label', 'Copy code block');
        btn.appendChild(createCopyIcon());

          btn.replaceChildren(createCheckIcon());

          timer = setTimeout(function () {
            btn.replaceChildren(createCopyIcon());
            btn.classList.remove('copied');

          ta.value = text;
