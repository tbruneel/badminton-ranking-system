<h1 id="badminton-elo-ranking-system">Badminton ELO Ranking System</h1>
<p>A zero-cost, serverless ELO ranking and match-logging system for badminton clubs and groups, powered by <strong>GitHub Pages</strong> (frontend) and <strong>Google Sheets + Google Apps Script</strong> (database &amp; formula engine).</p>
<ul>
<li><strong>VUB SportMix Ranking Page:</strong> <a href="https://tbruneel.github.io/badminton-ranking-system/vub-sportmix-badminton/">https://tbruneel.github.io/badminton-ranking-system/vub-sportmix-badminton/</a></li>
<li><strong>Technical Architecture &amp; Implementation Guide:</strong> <a href="./technical.md">technical.md</a> (<a href="./technical.md.html">HTML version</a>)</li>
</ul>
<hr>
<h2 id="features">Features</h2>
<ul>
<li><strong>Dual Leaderboards:</strong> Separate ELO ratings, podiums, and match histories for <strong>Doubles (2v2)</strong> and <strong>Singles (1v1)</strong>.</li>
<li><strong>Live Match Logging &amp; ELO Preview:</strong> Instant expected win-probability and ELO delta preview before submitting a match, with SliceWin-style set score entry and searchable player comboboxes.</li>
<li><strong>Interactive Player Profiles:</strong> Per-player ELO progression charts, peak ELO tracking, win/loss/tie statistics, partner synergy, and head-to-head records.</li>
<li><strong>Multi-Group Support:</strong> Host multiple independent group ranking pages from a single repository by adding a lightweight subfolder <code>index.html</code> that points to its own Google Sheet Web App URL.</li>
</ul>
<hr>
<h2 id="how-to-set-up-a-new-ranking-page">How to Set Up a New Ranking Page</h2>
<h3 id="1-create-the-google-sheet--apps-script-backend">1. Create the Google Sheet &amp; Apps Script Backend</h3>
<ol>
<li>Create a new <strong>Google Sheet</strong> (via <a href="https://sheets.new">sheets.new</a>).</li>
<li>Open <strong>Extensions → Apps Script</strong>, replace the contents of <code>Code.gs</code> with <a href="./code.gs"><code>code.gs</code></a> from this repository, and save (<code>Ctrl+S</code>).</li>
<li>In the Apps Script toolbar, select <code>setupSheet</code> from the function dropdown and click <strong>Run</strong> (grant permissions when prompted).
<ul>
<li>This automatically creates and formats the <code>Players</code>, <code>Doubles_Matches</code>, and <code>Singles_Matches</code> tabs with all ELO formulas and conditional formatting.</li>
</ul>
</li>
<li>Set the admin password for logging matches and adding players:
<ul>
<li>Go to <strong>Project Settings</strong> (⚙️ icon on the left) → <strong>Script Properties</strong> → <strong>Add script property</strong>.</li>
<li>Set Property to <code>ADMIN_PASSWORD</code> and Value to your chosen admin password, then click <strong>Save script properties</strong>.</li>
</ul>
</li>
<li>Deploy the script as a Web App:
<ul>
<li>Click <strong>Deploy → New deployment</strong>.</li>
<li>Select type: <strong>Web app</strong>.</li>
<li>Set <strong>Execute as</strong>: <code>Me</code>.</li>
<li>Set <strong>Who has access</strong>: <code>Anyone</code>.</li>
<li>Click <strong>Deploy</strong> and copy the resulting <strong>Web App URL</strong> (ending in <code>/exec</code>).</li>
</ul>
</li>
</ol>

<li>Create a new subfolder in this repository (for example, <code>my-badminton-club/index.html</code>) patterned after <a href="./vub-sportmix-badminton/index.html"><code>vub-sportmix-badminton/index.html</code></a>:</li>
</ol>

<li>Commit and push to <code>main</code>. Once GitHub Pages deploys, your ranking page will be live at <code>https://&lt;username&gt;.github.io/badminton-ranking-system/my-badminton-club/</code>.</li>
</ol>
<hr>
<h2 id="updating-the-apps-script-backend">Updating the Apps Script Backend</h2>
<p>If you update <a href="./code.gs"><code>code.gs</code></a> in the future:</p>
<ol>
<li>Paste the updated <a href="./code.gs"><code>code.gs</code></a> into the Google Apps Script editor and save (<code>Ctrl+S</code>).</li>
<li>Run <code>setupSheet</code> if the sheet formulas or ELO constants were modified (this safely refreshes formulas on all existing rows without erasing player or match data).</li>
<li>Click <strong>Deploy → Manage deployments</strong>, click the <strong>Edit (✏️)</strong> icon on your active deployment, select <strong>Version: New version</strong>, and click <strong>Deploy</strong>.
<ul>
<li>Updating the existing deployment preserves your <code>/exec</code> URL so no changes are needed in your frontend config.</li>
</ul>
</li>
</ol>
<script>
(function () {
  function createCopyIcon() {
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('aria-hidden', 'true');
    svg.setAttribute('focusable', 'false');
    svg.setAttribute('width', '16');
    svg.setAttribute('height', '16');
    svg.setAttribute('viewBox', '0 0 16 16');
    svg.setAttribute('fill', 'none');
    var p1 = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p1.setAttribute('d', 'M4 4H2V14H11V12H4V4Z');
    p1.setAttribute('fill', 'currentColor');
    var p2 = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p2.setAttribute('fill-rule', 'evenodd');
    p2.setAttribute('clip-rule', 'evenodd');
    p2.setAttribute('d', 'M5 2H14V11H5V2ZM6 3H13V10H6V3Z');
    p2.setAttribute('fill', 'currentColor');
    svg.appendChild(p1);
    svg.appendChild(p2);
    return svg;
  }
  function createCheckIcon() {
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('aria-hidden', 'true');
    svg.setAttribute('focusable', 'false');
    svg.setAttribute('width', '16');
    svg.setAttribute('height', '16');
    svg.setAttribute('viewBox', '0 0 16 16');
    svg.setAttribute('fill', 'none');
    var p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', 'M6.27 10.87L3.63 8.23L2.56 9.3L6.27 13.01L14.07 5.21L13 4.14L6.27 10.87Z');
    p.setAttribute('fill', 'currentColor');
    svg.appendChild(p);
    return svg;
  }
  function initCopyButtons() {
    var blocks = document.querySelectorAll('pre > code');
    for (var i = 0; i < blocks.length; i++) {
      (function (code) {
        var pre = code.parentElement;
        if (!pre || pre.querySelector('.code-block-copy-button')) return;
        var btn = document.createElement('button');
        btn.className = 'code-block-copy-button';
        btn.type = 'button';
        btn.setAttribute('aria-label', 'Copy code block');
        btn.appendChild(createCopyIcon());
        var timer = null;
        function markCopied() {
          btn.replaceChildren(createCheckIcon());
          btn.classList.add('copied');
          if (timer) clearTimeout(timer);
          timer = setTimeout(function () {
            btn.replaceChildren(createCopyIcon());
            btn.classList.remove('copied');
            timer = null;
          }, 2000);
        }
        function fallbackCopy(text) {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          try {
            document.execCommand('copy');
            markCopied();
          } finally {
            document.body.removeChild(ta);
          }
        }
        btn.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          var text = code.textContent || '';
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(markCopied).catch(function () {
              fallbackCopy(text);
            });
          } else {
            fallbackCopy(text);
          }
        });
        pre.appendChild(btn);
      })(blocks[i]);
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initCopyButtons);
  } else {
    initCopyButtons();
  }
})();
</script>
